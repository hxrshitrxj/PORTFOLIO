<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="sportsGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#bf0603" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#190306" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080102" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fe6402"/>
      <stop offset="100%" stop-color="#800e13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sportsGlow)"/>

  <!-- Stadium Floodlight Beams -->
  <polygon points="100,0 280,0 600,600 350,600" fill="#ffaa00" opacity="0.08"/>
  <polygon points="1100,0 920,0 600,600 850,600" fill="#ffaa00" opacity="0.08"/>

  <!-- Curved Running Track Lanes Perspective -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer Track Boundary -->
    <path d="M -50,680 C 300,520 900,520 1250,680" stroke="#ff3c00" stroke-width="26" opacity="0.85"/>
    <path d="M -50,640 C 300,480 900,480 1250,640" stroke="#fe6402" stroke-width="20" opacity="0.85"/>
    <path d="M -50,605 C 300,445 900,445 1250,605" stroke="#ff8800" stroke-width="16" opacity="0.85"/>
    <path d="M -50,575 C 300,415 900,415 1250,575" stroke="#ffaa00" stroke-width="12" opacity="0.85"/>

    <!-- Lane Dashed Markings -->
    <path d="M -50,660 C 300,500 900,500 1250,660" stroke="#ffffff" stroke-width="2" stroke-dasharray="16 16" opacity="0.75"/>
    <path d="M -50,622 C 300,462 900,462 1250,622" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 14" opacity="0.75"/>
    <path d="M -50,590 C 300,430 900,430 1250,590" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 12" opacity="0.75"/>
  </g>

  <!-- Track Lane Number Badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.85">
    <text x="380" y="555">1</text>
    <text x="490" y="585">2</text>
    <text x="610" y="618">3</text>
    <text x="730" y="650">4</text>
  </g>

  <!-- Stadium Lighting Towers -->
  <rect x="180" y="160" width="10" height="200" fill="#2d050c"/>
  <circle cx="185" cy="150" r="16" fill="#ffb703" opacity="0.8"/>
  <circle cx="185" cy="150" r="32" fill="#ff7700" opacity="0.2"/>

  <rect x="1010" y="160" width="10" height="200" fill="#2d050c"/>
  <circle cx="1015" cy="150" r="16" fill="#ffb703" opacity="0.8"/>
  <circle cx="1015" cy="150" r="32" fill="#ff7700" opacity="0.2"/>

  <!-- Top Metadata Badge -->
  <rect x="60" y="50" width="310" height="34" rx="17" fill="rgba(18, 2, 5, 0.7)" stroke="rgba(255, 170, 0, 0.35)" stroke-width="1"/>
  <circle cx="80" cy="67" r="4" fill="#fe6402"/>
  <text x="96" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffcc66" letter-spacing="2">ATHLETICS &amp; FIELD LOGISTICS</text>

  <!-- Editorial Title Typography -->
  <text x="60" y="290" font-family="'Syne', sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">ANNUAL SPORTS EVENT</text>
  <text x="60" y="335" font-family="'Outfit', sans-serif" font-size="22" font-weight="600" fill="#ffb703" letter-spacing="3">TRACK &amp; FIELD MARSHALING // HEAT COORDINATION</text>

  <!-- Camera Frame Corners -->
  <path d="M 40,80 L 40,40 L 80,40" fill="none" stroke="#ffaa00" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1120,40 L 1160,40 L 1160,80" fill="none" stroke="#ffaa00" stroke-width="2.5" opacity="0.8"/>
  <path d="M 40,720 L 40,760 L 80,760" fill="none" stroke="#ffaa00" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1160,720 L 1160,760 L 1120,760" fill="none" stroke="#ffaa00" stroke-width="2.5" opacity="0.8"/>
</svg>

