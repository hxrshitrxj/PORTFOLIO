<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="festGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#7209b7" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#14020a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070104" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonLaser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#festGlow)"/>

  <!-- Festival Laser Beams -->
  <line x1="600" y1="180" x2="0" y2="700" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>
  <line x1="600" y1="180" x2="250" y2="800" stroke="#ff007f" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="180" x2="600" y2="800" stroke="#ffaa00" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="180" x2="950" y2="800" stroke="#ff007f" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="180" x2="1200" y2="700" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>

  <!-- Festival Sound Wave / Graphic Equalizer -->
  <g fill="url(#neonLaser)" opacity="0.75">
    <rect x="360" y="480" width="8" height="60" rx="4"/>
    <rect x="380" y="440" width="8" height="100" rx="4"/>
    <rect x="400" y="420" width="8" height="120" rx="4"/>
    <rect x="420" y="460" width="8" height="80" rx="4"/>
    <rect x="440" y="390" width="8" height="150" rx="4"/>
    <rect x="460" y="430" width="8" height="110" rx="4"/>
    <rect x="480" y="470" width="8" height="70" rx="4"/>
    <rect x="500" y="410" width="8" height="130" rx="4"/>
    <rect x="520" y="360" width="8" height="180" rx="4"/>
    <rect x="540" y="420" width="8" height="120" rx="4"/>
    <rect x="560" y="450" width="8" height="90" rx="4"/>
    <rect x="580" y="340" width="8" height="200" rx="4"/>
    <rect x="600" y="320" width="8" height="220" rx="4"/>
    <rect x="620" y="340" width="8" height="200" rx="4"/>
    <rect x="640" y="450" width="8" height="90" rx="4"/>
    <rect x="660" y="420" width="8" height="120" rx="4"/>
    <rect x="680" y="360" width="8" height="180" rx="4"/>
    <rect x="700" y="410" width="8" height="130" rx="4"/>
    <rect x="720" y="470" width="8" height="70" rx="4"/>
    <rect x="740" y="430" width="8" height="110" rx="4"/>
    <rect x="760" y="390" width="8" height="150" rx="4"/>
    <rect x="780" y="460" width="8" height="80" rx="4"/>
    <rect x="800" y="420" width="8" height="120" rx="4"/>
    <rect x="820" y="440" width="8" height="100" rx="4"/>
    <rect x="840" y="480" width="8" height="60" rx="4"/>
  </g>

  <!-- Central Festival Shield / Crest Motif -->
  <circle cx="600" cy="220" r="48" fill="#1b0314" stroke="#00e5ff" stroke-width="2.5"/>
  <circle cx="600" cy="220" r="58" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M 600,195 L 618,220 L 600,245 L 582,220 Z" fill="none" stroke="#ffaa00" stroke-width="2.5"/>

  <!-- Top Metadata Badge -->
  <rect x="60" y="50" width="340" height="34" rx="17" fill="rgba(18, 2, 5, 0.7)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
  <circle cx="80" cy="67" r="4" fill="#00e5ff"/>
  <text x="96" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a0f0ff" letter-spacing="2">SILIGURI // INTER-SCHOOL VOLUNTEER</text>

  <!-- Editorial Title Typography -->
  <text x="60" y="680" font-family="'Syne', sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">BOSCO FEST — SILIGURI</text>
  <text x="60" y="725" font-family="'Outfit', sans-serif" font-size="22" font-weight="600" fill="#00e5ff" letter-spacing="3">DELEGATION FACILITATION &amp; VOLUNTEER LOGISTICS</text>

  <!-- Camera Frame Corners -->
  <path d="M 40,80 L 40,40 L 80,40" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1120,40 L 1160,40 L 1160,80" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 40,720 L 40,760 L 80,760" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 1160,720 L 1160,760 L 1120,760" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.8"/>
</svg>

