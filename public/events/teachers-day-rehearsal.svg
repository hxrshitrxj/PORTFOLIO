<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="rehearsalGlow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#2a050c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0102" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="techLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffaa00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#rehearsalGlow)"/>

  <!-- Backstage Sounddesk and Mixing Grid Blueprint -->
  <g stroke="rgba(255, 140, 0, 0.15)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Sound Console / Cue Station Graphic -->
  <rect x="240" y="320" width="720" height="300" rx="12" fill="#180307" stroke="rgba(255, 170, 40, 0.4)" stroke-width="2"/>
  <rect x="280" y="360" width="640" height="40" rx="6" fill="#24050a" stroke="rgba(255, 100, 0, 0.3)" stroke-width="1"/>
  <line x1="280" y1="380" x2="920" y2="380" stroke="url(#techLine)" stroke-width="3"/>

  <!-- Fader Channels -->
  <g fill="#ffaa00">
    <rect x="320" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="316" y="470" width="16" height="24" rx="3" fill="#ffaa00"/>
    
    <rect x="420" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="416" y="490" width="16" height="24" rx="3" fill="#ff7700"/>

    <rect x="520" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="516" y="460" width="16" height="24" rx="3" fill="#ffaa00"/>

    <rect x="620" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="616" y="520" width="16" height="24" rx="3" fill="#ff4400"/>

    <rect x="720" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="716" y="480" width="16" height="24" rx="3" fill="#ffaa00"/>

    <rect x="820" y="440" width="8" height="120" rx="4" fill="#30080f"/>
    <rect x="816" y="450" width="16" height="24" rx="3" fill="#00ff88"/>
  </g>

  <!-- Editorial Info -->
  <rect x="60" y="50" width="300" height="34" rx="17" fill="rgba(18, 2, 5, 0.7)" stroke="rgba(255, 170, 0, 0.35)" stroke-width="1"/>
  <circle cx="80" cy="67" r="4" fill="#ffaa00"/>
  <text x="96" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffcc66" letter-spacing="2">STAGE &amp; AUDIO CONTROLS</text>

  <text x="60" y="710" font-family="'Syne', sans-serif" font-size="44" font-weight="800" fill="#ffffff">BACKSTAGE COORDINATION</text>
  <text x="60" y="745" font-family="'Outfit', sans-serif" font-size="18" fill="#ffcca0" letter-spacing="2">REHEARSALS, CUE CARDS &amp; RUNNING ORDERS</text>
</svg>

