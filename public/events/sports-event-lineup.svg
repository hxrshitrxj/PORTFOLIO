<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="lineupGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e0409" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0102" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#lineupGlow)"/>

  <!-- Marshalling Zone Grid & Staging Blocks -->
  <g stroke="rgba(255, 120, 0, 0.2)" stroke-width="1.5">
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="360" x2="1100" y2="360"/>
    <line x1="100" y1="520" x2="1100" y2="520"/>
  </g>

  <!-- Starting Blocks / Heat Boxes -->
  <g>
    <rect x="180" y="240" width="160" height="80" rx="8" fill="#24050a" stroke="#ffaa00" stroke-width="2"/>
    <text x="260" y="275" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffb703" text-anchor="middle">HEAT 01</text>
    <text x="260" y="300" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">100M SPRINT</text>

    <rect x="420" y="240" width="160" height="80" rx="8" fill="#24050a" stroke="#ff8800" stroke-width="2"/>
    <text x="500" y="275" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffb703" text-anchor="middle">HEAT 02</text>
    <text x="500" y="300" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">200M DASH</text>

    <rect x="660" y="240" width="160" height="80" rx="8" fill="#24050a" stroke="#ff6600" stroke-width="2"/>
    <text x="740" y="275" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffb703" text-anchor="middle">HEAT 03</text>
    <text x="740" y="300" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">400M RELAY</text>

    <rect x="900" y="240" width="160" height="80" rx="8" fill="#24050a" stroke="#00ff88" stroke-width="2"/>
    <text x="980" y="275" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00ff88" text-anchor="middle">HEAT 04</text>
    <text x="980" y="300" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">FIELD EVENTS</text>
  </g>

  <!-- Stopwatch / Timing Symbol -->
  <circle cx="600" cy="460" r="45" fill="none" stroke="#ffaa00" stroke-width="3"/>
  <line x1="600" y1="460" x2="600" y2="430" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="460" x2="625" y2="460" stroke="#ff7700" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Metadata Badge -->
  <rect x="60" y="50" width="300" height="34" rx="17" fill="rgba(18, 2, 5, 0.7)" stroke="rgba(255, 170, 0, 0.35)" stroke-width="1"/>
  <circle cx="80" cy="67" r="4" fill="#ff5500"/>
  <text x="96" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffcc66" letter-spacing="2">HEAT STAGING &amp; MARSHALING</text>

  <text x="60" y="700" font-family="'Syne', sans-serif" font-size="44" font-weight="800" fill="#ffffff">ATHLETE QUEUEING &amp; DISPATCH</text>
  <text x="60" y="740" font-family="'Outfit', sans-serif" font-size="18" fill="#ffcca0" letter-spacing="2">CALL-UP PROTOCOLS &amp; TIMING ACCURACY</text>
</svg>

